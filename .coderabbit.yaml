
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false

  instructions: |
    Review this Go REST API built with Chi, GORM, and MySQL.

    Focus on:
    - Bugs and regressions introduced by the PR.
    - Incorrect HTTP status codes and response envelopes.
    - Error handling and resource cleanup.
    - Race conditions and transaction correctness.

    Keep findings specific to the changed code.
    Do not report style-only issues unless they affect correctness.
    Avoid speculative findings. Explain concrete impact.
