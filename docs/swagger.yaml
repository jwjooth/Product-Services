basePath: /api/v1
definitions:
  helper.ErrorEnvelope:
    properties:
      error:
        type: string
    type: object
  helper.SuccessEnvelope:
    properties:
      data: {}
      message:
        type: string
      meta: {}
    type: object
  payload.CreateProductRequest:
    properties:
      category:
        maxLength: 50
        type: string
      description:
        maxLength: 5000
        type: string
      imageUrl:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      price:
        type: number
      sku:
        maxLength: 50
        type: string
      stock:
        minimum: 0
        type: integer
    required:
    - name
    - price
    - sku
    type: object
  payload.ListProductsMeta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  payload.ProductResponse:
    properties:
      category:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      name:
        type: string
      price:
        type: number
      rating:
        type: number
      reviewCount:
        type: integer
      sku:
        type: string
      stock:
        type: integer
      updated_at:
        type: string
    type: object
  payload.UpdateProductRequest:
    properties:
      category:
        maxLength: 50
        type: string
      description:
        maxLength: 5000
        type: string
      imageUrl:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      price:
        type: number
      sku:
        maxLength: 50
        type: string
      stock:
        minimum: 0
        type: integer
    required:
    - name
    - price
    - sku
    type: object
info:
  contact: {}
  description: API documentation for the Golang Product RESTful API
  title: Golang RESTful API
  version: 1.0.0
paths:
  /api/v1/products:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of all products
      parameters:
      - default: 1
        description: Page number (1-based)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Items per page (max 100)
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      - description: Filter by category
        in: query
        name: category
        type: string
      - description: Minimum price
        in: query
        name: min_price
        type: number
      - description: Maximum price
        in: query
        name: max_price
        type: number
      - description: Search query (name or SKU)
        in: query
        name: q
        type: string
      - description: 'Sort order: price_asc, price_desc, name_asc, newest'
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.SuccessEnvelope'
            - properties:
                Data:
                  items:
                    $ref: '#/definitions/payload.ProductResponse'
                  type: array
                Meta:
                  $ref: '#/definitions/payload.ListProductsMeta'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helper.ErrorEnvelope'
      tags:
      - product
    post:
      consumes:
      - application/json
      description: Create a new product with the provided details
      parameters:
      - description: Product request payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/payload.CreateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.SuccessEnvelope'
            - properties:
                Data:
                  items:
                    $ref: '#/definitions/payload.ProductResponse'
                  type: array
              type: object
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/helper.SuccessEnvelope'
            - properties:
                Data:
                  $ref: '#/definitions/payload.ProductResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helper.ErrorEnvelope'
      tags:
      - product
  /api/v1/products/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a product by its unique ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helper.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helper.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helper.ErrorEnvelope'
      tags:
      - product
    get:
      consumes:
      - application/json
      description: Retrieve a single product by its unique ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.SuccessEnvelope'
            - properties:
                Data:
                  $ref: '#/definitions/payload.ProductResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helper.ErrorEnvelope'
      tags:
      - product
    put:
      consumes:
      - application/json
      description: Update an existing product by its ID with the provided details
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Product update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/payload.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.SuccessEnvelope'
            - properties:
                Data:
                  $ref: '#/definitions/payload.ProductResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helper.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helper.ErrorEnvelope'
      tags:
      - product
swagger: "2.0"
