name: Go CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run 'gofmt -w .' to fix formatting issues:"
            echo "$unformatted"
            exit 1
          fi

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Regenerate swagger docs
        run: swag init -g main.go -o docs

      - name: Check swagger docs are up to date
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is out of date. Run 'swag init -g main.go -o docs' and commit the result."
            git diff -- docs/
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v6
        with:
          install-mode: goinstall

  comment-on-failure:
    needs: build
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR if build failed
        uses: actions/github-script@v7
        with:
          script: |
            const message = [
              "⚠️ **CI Check Failed!**",
              "",
              "Terdapat kesalahan dalam pipeline:",
              "- Pastikan semua unit test lolos.",
              "- Jalankan `go test ./...` secara lokal untuk melihat detail error."
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const hasComment = comments.some(
              (c) => c.user.login === "github-actions[bot]" && c.body.includes("CI Check Failed"),
            );
            if (!hasComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message,
              });
            }

  pr-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: PR Agent review
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          CONFIG.MODEL: gemini/gemini-2.0-flash
