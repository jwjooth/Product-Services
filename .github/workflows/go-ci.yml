name: Go CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (echo "Run 'gofmt -w .' to fix" && exit 1)

      - name: Comment on PR if test failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const message = `⚠️ **CI Check Failed!**\n\nTerdapat kesalahan dalam pipeline:\n- Pastikan semua unit test lolos.\n- Jalankan 'go test ./...' secara lokal untuk melihat detail error.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            const hasComment = comments.some(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('CI Check Failed')
            );
            if (!hasComment) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: message
              });
            }
      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Regenerate swagger docs
        run: swag init -g main.go -o docs

      - name: Check swagger docs are up to date
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is out of date. Run 'swag init -g main.go -o docs' and commit the result."
            git diff -- docs/
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service Product-CRUD-API --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          install-mode: goinstall
